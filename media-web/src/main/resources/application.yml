server:
  port: 8080

spring:
  application:
    name: media-news
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/news_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: '000000'
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.connor.newsplatform.domain.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

media:
  jwt:
    secret-key: media-news-secret-key
    ttl: 86400000
  oss:
    endpoint: your-endpoint
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: your-bucket
    url-prefix: https://your-bucket.oss-cn.com/
  pay:
    # 走平台内 mock 支付（推荐，无需沙箱账号）；切到真沙箱时改 false 并自行接入
    mock: true
    # 未支付订单超时关单时间（分钟）
    timeout-minutes: 30

# ============================================================
# 微信公众号扫码登录配置
# 「服务器地址(URL)」填内网穿透公网地址：
#   http://39.102.79.179:28080/api/v1/weixin/portal/receive
# 本地 8080 已通过 FRP 映射到公网 28080（见 frpc.toml 的 newsplatform 段）
# 以下为参照 s-pay-mall-moni 的 dev 沙箱测试公众号配置，可直接用；
# 若你有自己的公众号，替换 originalid/token/app-id/app-secret/template_id 即可
# ============================================================
weixin:
  config:
    # 公众号原始ID（基本配置）
    originalid: gh_8d4a452679cc
    # 自定义的 Token（需与公众号后台一致）
    token: moni89
    # 测试号 / 正式号 AppID
    app-id: wx3d051062be3da08e
    # AppSecret
    app-secret: cd4787b8ab849c1393261a5ab44eed0b
    # 模板消息 TemplateID（扫码成功下发登录通知）
    template_id: cMTsFxD7NFW9qQZit5YNk3GFv6JWww__Zg5WJFgo3lU

# ============================================================
# 支付宝沙箱支付配置  https://opendocs.alipay.com/common/02kkv7
# notify_url 用内网穿透公网地址（FRP 28080 -> 本地 8080）
# 默认 media.pay.mock=true 走平台内 mock 支付；置 false 即走真实沙箱
# 以下为参照 s-pay-mall-moni 的 dev 沙箱账号，可直接用
# ============================================================
alipay:
  app_id: 9021000165618682
  # 应用私钥（密钥工具生成）
  merchant_private_key: 
  # 支付宝公钥（支付宝后台查看）
  alipay_public_key: 
  # 异步通知（内网穿透公网地址，微信/支付宝能访问到本地 8080）
  notify_url: http://39.102.79.179:28080/api/v1/alipay/alipay_notify_url
  # 同步跳转
  return_url: https://gaga.plus
  # 沙箱网关
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
